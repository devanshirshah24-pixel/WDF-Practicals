
<html>
    <head>
        <title>Signup</title>
        <link rel="stylesheet" href="style.css">
    </head>

<body>

<nav class="navbar">
    <div class="nav-brand">StudentHub</div>
    <div class="nav-right">
        <a href="Home.html">Home</a>
        <button id="themeToggle" class="theme-toggle" title="Toggle light/dark theme">🌙</button>
    </div>
</nav>

        <h1 align="center">Welcome to StudentHub </h1><br>
<center>
<fieldset>
    <form id="signupform">
     <h3> Sign Up </h3>
    <label>Email:</label>
    <input type="text" id="email" placeholder="Enter the email" ><br>

    <label>Create Password:</label>
    <input type="password" id="createpassword" placeholder="Create the Password" ><br>

    <label>Confirm Password:</label>
    <input type="password" id="confirmpassword" placeholder="Enter the password" ><br>

    <input type="submit" value="Register">

    <p id="message"></p>
</form>
</fieldset>

</center>
<script src="script.js"></script>
</body>
</html>
